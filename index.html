<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>الجدول الدوري ثلاثي الأبعاد</title>
  <meta name="description" content="تجربة تفاعلية ثلاثية الأبعاد للجدول الدوري: دوّر العناصر واستكشف ذرة كل عنصر. عمل الطالبة لمار محمد مجممي، إشراف معلمة المادة هالة الوقداني.">
  <meta name="theme-color" content="#1E1F5C">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <canvas id="stage" aria-hidden="true"></canvas>

  <div class="ui" id="ui">
    <h1 class="sr-only">الجدول الدوري للعناصر</h1>

    <header class="bar">
      <div class="views" role="group" aria-label="طريقة العرض">
        <button type="button" data-view="table" aria-pressed="true">الجدول</button>
        <button type="button" data-view="towers" aria-pressed="false">أبراج الكتلة</button>
        <button type="button" data-view="helix" aria-pressed="false">الحلزون</button>
      </div>
      <button type="button" class="reset" id="reset">إعادة الضبط</button>
      <div class="search" role="search">
        <label class="sr-only" for="q">ابحث عن عنصر</label>
        <input id="q" type="search" placeholder="ابحث بالاسم أو الرمز أو العدد الذري" autocomplete="off" enterkeyhint="search">
        <ul id="results" hidden></ul>
      </div>
      <p id="caption" aria-live="polite"></p>
    </header>

    <div id="safe" aria-hidden="true"></div>

    <aside id="panel" hidden aria-label="تفاصيل العنصر">
      <div class="panel-tools">
        <button type="button" id="prev" aria-label="العنصر السابق">السابق</button>
        <button type="button" id="next" aria-label="العنصر التالي">التالي</button>
        <button type="button" id="close" aria-label="إغلاق التفاصيل">إغلاق</button>
      </div>
      <div class="panel-body">
        <div class="identity">
          <span class="p-symbol" id="pSymbol" dir="ltr"></span>
          <div>
            <h2 id="pName"></h2>
            <p id="pEn" dir="ltr"></p>
          </div>
        </div>
        <canvas id="atom" aria-label="نموذج ذرة العنصر"></canvas>
        <dl id="facts"></dl>
      </div>
    </aside>

    <nav id="legend" aria-label="تصنيف العناصر"></nav>

    <footer class="credit">
      <span>عمل الطالبة لمار محمد مجممي</span>
      <span class="dash"> - </span>
      <span>إشراف معلمة المادة هالة الوقداني</span>
    </footer>
  </div>

  <ul id="srlist" class="sr-only" aria-label="قائمة العناصر"></ul>
  <div id="loader" role="status">جارٍ تجهيز العناصر</div>
  <noscript><p class="fatal">تحتاج هذه التجربة إلى تفعيل JavaScript في المتصفح.</p></noscript>

  <script src="assets/app.js" defer></script>
</body>
</html>
